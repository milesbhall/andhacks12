# DigitalOcean App Platform spec:  doctl apps create --spec deploy/digitalocean-app.yaml
# (or create the app in the web console from the GitHub repo; it will find the Dockerfile)
name: fed-surprise-desk
services:
  - name: dashboard
    github:
      repo: milesbhall/andhacks12
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - {key: GEMINI_API_KEY, type: SECRET}
      - {key: ELEVENLABS_API_KEY, type: SECRET}
      - {key: TIGER_DB_URL, type: SECRET}
      - {key: BACKBOARD_API_KEY, type: SECRET}
      - {key: STREAMLIT_SECRETS, type: SECRET}   # contents of .streamlit/secrets.toml (Auth0)
      - {key: ALLOWED_TRADERS, value: "omofkmg@gmail.com"}
      - {key: KALSHI_ENV, value: "demo"}
