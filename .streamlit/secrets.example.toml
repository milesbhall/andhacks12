# Copy to .streamlit/secrets.toml (gitignored) and fill in from the Auth0 dashboard:
# Applications -> Create Application -> Regular Web Application.
# In Auth0 "Allowed Callback URLs" add BOTH:
#   http://localhost:8501/oauth2callback
#   https://<your-domain>/oauth2callback
# Emails allowed to switch on LIVE orders in the dashboard (everyone else: dry run only)
allowed_traders = ["you@example.com"]

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "any-long-random-string"

[auth.auth0]
client_id = "YOUR_AUTH0_CLIENT_ID"
client_secret = "YOUR_AUTH0_CLIENT_SECRET"
server_metadata_url = "https://YOUR_TENANT.us.auth0.com/.well-known/openid-configuration"
